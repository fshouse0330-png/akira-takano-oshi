name: スケジュール自動更新

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要ライブラリをインストール
        run: pip install requests beautifulsoup4

      - name: スケジュールを取得・更新
        run: python scraper.py

      - name: data.json をコミット・プッシュ
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 スケジュール自動更新"
          file_pattern: data.json
